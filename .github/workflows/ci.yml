name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt flake8
      - run: flake8 pipeline stata_bridge --max-line-length=100
      - name: Smoke-test the synthetic data pipeline
        run: |
          python pipeline/generate_synthetic_data.py
          python stata_bridge/read_dta_example.py
      - name: Check the site's data files are valid JSON/CSV
        run: |
          python -c "import json; json.load(open('docs/data/processed/synthetic_regions.geojson'))"
          python -c "import pandas as pd; pd.read_csv('docs/data/processed/synthetic_indicators.csv')"

  r-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages("lintr")'
      - run: Rscript -e 'lintr::lint_dir("analysis")'

# Note: no separate "deploy" job is needed. Once the repository's
# Settings -> Pages is set to "Deploy from branch: main, folder: /docs",
# GitHub publishes the site automatically on every push to main.
